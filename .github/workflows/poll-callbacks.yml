name: Poll Payment Callbacks

on:
  schedule:
    # GitHub treats this as "best effort" — in practice runs land every
    # 5-20 min. This job also sends the Sunday reminder as a catch-up if the
    # weekly workflow below is late or skipped.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # Allow manual trigger from GitHub UI

# Shared with weekly-reminder.yml so the two never race on ledger.json
concurrency:
  group: payment-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Poll callbacks + check nudge
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USERNAMES: ${{ secrets.USERNAMES }}
          AMOUNT_PER_PERSON: ${{ secrets.AMOUNT_PER_PERSON }}
          AMOUNT_TOTAL: ${{ secrets.AMOUNT_TOTAL }}
          LEDGER_PATH: ledger.json
        run: python3 poll_callbacks.py

      - name: Save ledger to repo
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USERNAMES: ${{ secrets.USERNAMES }}
          AMOUNT_PER_PERSON: ${{ secrets.AMOUNT_PER_PERSON }}
          AMOUNT_TOTAL: ${{ secrets.AMOUNT_TOTAL }}
          LEDGER_PATH: ledger.json
        run: './push_ledger.sh "chore: update ledger [skip ci]"'
