name: Weekly Payment Reminder

on:
  schedule:
    # Sunday 04:02 UTC = 12:02 SGT. Off the top of the hour because GitHub
    # delays/drops :00 schedules the most. If this still runs late, the
    # 5-minute poller sends the reminder anyway (and this job then skips).
    - cron: '2 4 * * 0'
  workflow_dispatch:       # Allow manual trigger from GitHub UI

concurrency:
  group: payment-bot
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send weekly reminder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USERNAMES: ${{ secrets.USERNAMES }}
          AMOUNT_PER_PERSON: ${{ secrets.AMOUNT_PER_PERSON }}
          AMOUNT_TOTAL: ${{ secrets.AMOUNT_TOTAL }}
          LEDGER_PATH: ledger.json
        run: python3 send_reminder.py

      - name: Save ledger to repo
        run: |
          git config user.name "payment-bot"
          git config user.email "bot@github-actions"
          git add ledger.json ledger.md
          git diff --staged --quiet || git commit -m "chore: reminder sent [skip ci]"
          git pull --rebase origin main
          git push
